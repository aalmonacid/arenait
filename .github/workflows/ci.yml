# Compuertas mínimas antes de fusionar a main (un push a main despliega solo en
# Cloudflare). Los e2e de Playwright aún no corren aquí: ver PLAN-MEJORAS.md 4.5.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos (astro check)
        run: npm run check
      - name: Pruebas unitarias
        run: npm run test:unit
      - name: Build
        run: npm run build
      # Informativo: los avisos actuales vienen de la cadena del CLI de Sanity (no
      # del runtime del Worker). No bloquea; revisar el resultado en el log.
      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
